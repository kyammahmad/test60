<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>60 ثانية | 60 Seconds</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        secondary: '#ec4899',
                        dark: '#0f172a',
                        glass: 'rgba(255, 255, 255, 0.1)'
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-bg: rgba(15, 23, 42, 0.7);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #000000 100%);
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 6s infinite alternate;
        }
        .shape-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: #6366f1; }
        .shape-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #ec4899; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .target-btn { position: absolute; transition: all 0.1s ease; cursor: pointer; }
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; align-items: center; pointer-events: none; }
        .toast { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 16px; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: fadeUp 0.3s forwards; text-align: center; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div id="app" class="w-full max-w-md glass-panel rounded-3xl overflow-hidden relative min-h-[600px] flex flex-col">
        <!-- Dynamic Content -->
    </div>
    
    <div id="toast-container"></div>

    <script>
        // Data & State Management (Offline-First Robust Simulator)
        const AVATARS = ['🦊', '🐯', '🐰', '🐸', '🐼', '🤖', '👻', '👽', '👾', '🤡'];
        const MINIGAMES = [
            { id: 'speed_tap', name: 'النقرات السريعة', desc: 'اضغط على الهدف بأسرع ما يمكن!' },
            { id: 'quick_math', name: 'الرياضيات السريعة', desc: 'حل المسائل أسرع من خصمك!' },
            { id: 'color_match', name: 'تطابق الألوان', desc: 'اختر اللون المكتوب وليس لون الخط!' }
        ];

        const State = {
            view: 'loading', // loading, login, menu, shop, lobby, game, results, ads
            user: null, // { uid, name, avatar, coins, xp, level }
            roomId: null,
            room: null,
            myMicOn: false,
            gameInterval: null,
            gameLocalState: {
                timeLeft: 60,
                targetPos: { x: 50, y: 50 }
            }
        };

        const AppContainer = document.getElementById('app');

        function render() {
            let html = '';
            switch(State.view) {
                case 'loading': html = renderLoading(); break;
                case 'login': html = renderLogin(); break;
                case 'menu': html = renderMenu(); break;
                case 'shop': html = renderShop(); break;
                case 'lobby': html = renderLobby(); break;
                case 'game': html = renderGame(); break;
                case 'results': html = renderResults(); break;
                case 'ads': html = renderAdsModal(); break;
                default: html = renderLoading();
            }
            AppContainer.innerHTML = html;
            attachEventListeners();
        }

        function renderLoading() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center animate-pulse">
                    <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
                    <h2 class="text-2xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">60 ثانية</h2>
                    <p class="text-gray-400">جاري إعداد اللعبة..</p>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-8 relative">
                    <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary drop-shadow-lg">60 ثانية</h1>
                    <p class="text-gray-300 mb-8 font-semibold">تحديات سريعة، متعة لا تنتهي</p>
                    
                    <div class="w-full glass-panel p-6 rounded-2xl flex flex-col gap-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-2">اختر صورتك الرمزية</label>
                            <div class="flex overflow-x-auto gap-2 pb-2">
                                ${AVATARS.map((emoji, i) => `
                                    <button data-action="select-avatar" data-val="${emoji}" class="avatar-btn text-3xl p-2 rounded-xl border-2 ${i === 0 ? 'border-primary bg-primary/20' : 'border-transparent bg-white/5'} transition-all flex-shrink-0">${emoji}</button>
                                `).join('')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-2">اسم اللاعب</label>
                            <input type="text" id="username-input" class="w-full bg-black/50 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary transition" placeholder="أدخل اسمك هنا..." maxlength="12" value="لاعب ${Math.floor(Math.random()*900+100)}">
                        </div>
                        <button data-action="create-profile" class="btn-primary w-full py-3 rounded-xl font-bold text-lg mt-2 cursor-pointer">دخول اللعبة</button>
                    </div>
                </div>
            `;
        }

        function renderMenu() {
            return `
                <div class="flex-1 flex flex-col p-6 relative">
                    <div class="glass-panel p-4 rounded-2xl flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="text-4xl bg-white/10 p-2 rounded-full border border-white/20">${State.user.avatar}</div>
                            <div>
                                <h3 class="font-bold text-lg leading-tight">${State.user.name}</h3>
                                <p class="text-xs text-primary font-bold">المستوى ${State.user.level}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="flex items-center gap-1 bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-sm font-bold border border-yellow-500/30">
                                <span>${State.user.coins}</span> 🪙
                            </div>
                            <button data-action="go-shop" class="text-xs text-gray-300 hover:text-white underline cursor-pointer">المتجر 🛒</button>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col justify-center gap-4">
                        <button data-action="create-room" class="btn-primary p-6 rounded-2xl flex flex-col items-center justify-center gap-2 group cursor-pointer">
                            <span class="text-3xl group-hover:scale-110 transition">🎮</span>
                            <span class="font-bold text-xl">إنشاء غرفة</span>
                            <span class="text-xs text-gray-200">العب مع أصدقائك (2-8 لاعبين)</span>
                        </button>
                        
                        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center gap-3">
                            <h4 class="font-bold text-lg mb-1">الانضمام لغرفة</h4>
                            <div class="flex w-full gap-2">
                                <input type="text" id="room-code-input" class="flex-1 bg-black/50 border border-gray-600 rounded-xl px-4 py-2 text-white text-center font-bold tracking-widest uppercase focus:outline-none focus:border-primary transition" placeholder="رمز الغرفة (مثال: A7K29)" maxlength="5">
                                <button data-action="join-room" class="btn-success px-6 rounded-xl font-bold cursor-pointer">دخول</button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex gap-2">
                        <button data-action="go-ads" class="flex-1 glass-panel py-3 rounded-xl flex justify-center items-center gap-2 hover:bg-white/10 transition text-sm font-bold cursor-pointer">
                            📺 مكافآت مجانية
                        </button>
                        <button data-action="buy-vip" class="flex-1 glass-panel py-3 rounded-xl flex justify-center items-center gap-2 hover:bg-white/10 transition text-sm font-bold border-yellow-500/50 text-yellow-400 cursor-pointer">
                            👑 إزالة الإعلانات
                        </button>
                    </div>
                </div>
            `;
        }

        function renderShop() {
            return `
                <div class="flex-1 flex flex-col p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">المتجر 🛒</h2>
                        <button data-action="go-menu" class="bg-white/10 px-4 py-2 rounded-xl text-sm hover:bg-white/20 transition cursor-pointer">عودة</button>
                    </div>
                    <div class="bg-yellow-500/20 text-yellow-400 p-4 rounded-xl text-center font-bold mb-6 border border-yellow-500/30">
                        رصيدك: ${State.user.coins} 🪙
                    </div>
                    <p class="text-center text-gray-400 mb-4">احصل على صور رمزية جديدة ومميزة!</p>
                    <div class="grid grid-cols-3 gap-3">
                        ${AVATARS.map((a, i) => `
                            <div class="glass-panel flex flex-col items-center justify-center p-4 rounded-xl gap-2 cursor-pointer hover:bg-white/10" data-action="buy-avatar" data-val="${a}">
                                <span class="text-4xl">${a}</span>
                                <span class="text-xs bg-black/50 px-2 py-1 rounded-full">${i < 5 ? 'مجاني' : '50 🪙'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdsModal() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                    <div class="text-6xl mb-4">📺</div>
                    <h2 class="text-2xl font-bold mb-2">شاهد إعلان واحصل على عملات!</h2>
                    <p class="text-gray-300 mb-8">احصل على 50 🪙 فورية لرصيدك.</p>
                    
                    <button data-action="watch-ad" class="btn-primary w-full py-4 rounded-xl font-bold text-lg mb-4 cursor-pointer">
                        مشاهدة الإعلان الآن
                    </button>
                    <button data-action="go-menu" class="w-full bg-white/10 py-3 rounded-xl hover:bg-white/20 transition cursor-pointer">عودة</button>
                </div>
            `;
        }

        function renderLobby() {
            if(!State.room) return renderLoading();
            const isHost = State.room.host === State.user.uid;
            const players = Object.values(State.room.players || {});
            const allReady = players.every(p => p.isReady);

            let playerListHTML = players.map(p => `
                <div class="glass-panel p-3 rounded-xl flex items-center justify-between ${p.uid === State.user.uid ? 'border-primary' : ''}">
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <span class="text-3xl">${p.avatar}</span>
                            ${p.micOn ? '<div class="absolute -bottom-1 -right-1 bg-green-500 w-3 h-3 rounded-full border border-black animate-pulse"></div>' : ''}
                        </div>
                        <span class="font-bold ${p.uid === State.room.host ? 'text-yellow-400' : 'text-white'}">${p.name} ${p.uid === State.room.host ? '👑' : ''}</span>
                    </div>
                    <div>
                        ${p.isReady ? '<span class="text-green-400 text-sm font-bold bg-green-400/10 px-2 py-1 rounded">جاهز</span>' : '<span class="text-gray-400 text-sm bg-black/50 px-2 py-1 rounded">ينتظر</span>'}
                    </div>
                </div>
            `).join('');

            let chatHTML = (State.room.chat || []).slice(-10).map(msg => `
                <div class="mb-1 text-sm"><span class="font-bold text-primary">${msg.name}:</span> <span class="text-gray-200">${msg.text}</span></div>
            `).join('');

            return `
                <div class="flex-1 flex flex-col p-4 h-full">
                    <div class="flex justify-between items-center mb-4 glass-panel p-3 rounded-xl">
                        <div>
                            <span class="text-xs text-gray-400 block">رمز الغرفة (شاركها مع أصدقائك)</span>
                            <span class="font-black text-xl tracking-widest text-secondary">${State.roomId}</span>
                        </div>
                        <div class="flex gap-2">
                            <button data-action="toggle-mic" class="bg-white/10 p-2 rounded-lg text-xl hover:bg-white/20 transition cursor-pointer ${State.myMicOn ? 'text-green-400' : 'text-gray-400'}">
                                ${State.myMicOn ? '🎤' : '🔇'}
                            </button>
                            <button data-action="leave-room" class="bg-red-500/20 text-red-400 p-2 rounded-lg text-sm hover:bg-red-500/40 transition cursor-pointer">مغادرة</button>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto pr-1 mb-4 flex flex-col gap-2">
                        <h3 class="text-sm text-gray-400 mb-1">اللاعبين (${players.length}/8)</h3>
                        ${playerListHTML}
                    </div>

                    <div class="glass-panel rounded-xl flex flex-col h-36 mb-4 overflow-hidden border-t border-white/10">
                        <div class="flex-1 overflow-y-auto p-3 flex flex-col justify-end text-right" id="chat-messages">
                            ${chatHTML || '<div class="text-center text-gray-500 text-sm my-auto">مرحباً بك في الدردشة!</div>'}
                        </div>
                        <div class="flex border-t border-white/10 p-2 gap-2 bg-black/30">
                            <input type="text" id="chat-input" class="flex-1 bg-transparent text-sm focus:outline-none px-2" placeholder="اكتب رسالة..">
                            <button data-action="send-chat" class="text-primary p-1 cursor-pointer font-bold">إرسال</button>
                        </div>
                    </div>

                    ${isHost 
                        ? `<button data-action="start-game" class="${allReady ? 'btn-primary' : 'bg-gray-600 cursor-not-allowed'} w-full py-4 rounded-xl font-bold text-lg shadow-lg cursor-pointer">${allReady ? 'بدء اللعبة' : 'بانتظار جاهزية الجميع'}</button>` 
                        : `<button data-action="toggle-ready" class="${State.room.players[State.user.uid]?.isReady ? 'bg-gray-600' : 'btn-success'} w-full py-4 rounded-xl font-bold text-lg shadow-lg cursor-pointer">${State.room.players[State.user.uid]?.isReady ? 'إلغاء الجاهزية' : 'أنا جاهز!'}</button>`
                    }
                </div>
            `;
        }

        function renderGame() {
            if(!State.room || !State.room.gameData) return renderLoading();
            const gd = State.room.gameData;
            const myScore = State.room.players[State.user.uid]?.score || 0;
            
            if (State.room.status === 'countdown') {
                return `
                    <div class="flex-1 flex flex-col items-center justify-center bg-black/80 z-50 absolute inset-0 rounded-3xl">
                        <h2 class="text-2xl mb-4 text-primary font-bold animate-pulse">تجهّز!</h2>
                        <div class="text-8xl font-black text-white" id="countdown-num">3</div>
                        <p class="mt-8 text-xl text-gray-300">${MINIGAMES.find(m => m.id === gd.type)?.name || ''}</p>
                    </div>
                `;
            }

            let gameAreaHTML = '';
            if (gd.type === 'speed_tap') {
                gameAreaHTML = `
                    <div class="flex-1 relative w-full border-2 border-white/10 rounded-xl overflow-hidden bg-black/30" id="tap-area">
                        <button data-action="tap-target" class="target-btn w-16 h-16 bg-gradient-to-r from-red-500 to-pink-500 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.6)] flex items-center justify-center text-2xl" style="left: ${State.gameLocalState.targetPos.x}%; top: ${State.gameLocalState.targetPos.y}%; transform: translate(-50%, -50%);">
                            🎯
                        </button>
                    </div>
                `;
            } else if (gd.type === 'quick_math') {
                const currentQ = gd.questions?.[gd.currentQIndex];
                gameAreaHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center w-full">
                        <div class="text-5xl font-black mb-8 font-mono bg-white/10 py-6 px-12 rounded-2xl border border-white/20 shadow-xl tracking-widest" dir="ltr">
                            ${currentQ.q} = ?
                        </div>
                        <div class="grid grid-cols-2 gap-4 w-full px-8">
                            ${currentQ.options.map(opt => `
                                <button data-action="answer-math" data-val="${opt}" class="glass-panel py-6 rounded-xl text-3xl font-bold hover:bg-white/20 active:scale-95 transition border border-white/10 shadow-lg cursor-pointer">${opt}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (gd.type === 'color_match') {
                const currentQ = gd.questions?.[gd.currentQIndex];
                const colorMap = { 'red': 'أحمر', 'blue': 'أزرق', 'green': 'أخضر', 'yellow': 'أصفر' };
                const hexMap = { 'red': '#ef4444', 'blue': '#3b82f6', 'green': '#10b981', 'yellow': '#eab308' };
                
                gameAreaHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center w-full">
                        <p class="text-sm text-gray-300 mb-2">اختر اللون الذي تقرأه كتابةً وليس لون الخط!</p>
                        <div class="text-6xl font-black mb-10" style="color: ${hexMap[currentQ.visualColor]}">
                            ${colorMap[currentQ.wordColor]}
                        </div>
                        <div class="grid grid-cols-2 gap-4 w-full px-8">
                            ${currentQ.options.map(optHex => `
                                <button data-action="answer-color" data-val="${optHex}" class="w-full h-24 rounded-xl active:scale-95 transition shadow-lg border-2 border-white/20 cursor-pointer" style="background-color: ${hexMap[optHex]}"></button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex-1 flex flex-col p-4 h-full">
                    <div class="flex justify-between items-center mb-4 glass-panel px-4 py-3 rounded-2xl">
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-400">الوقت</span>
                            <span class="font-black text-2xl text-secondary font-mono">${State.gameLocalState.timeLeft}s</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs text-gray-400">نقاطي</span>
                            <span class="font-black text-2xl text-primary font-mono">${myScore}</span>
                        </div>
                    </div>
                    ${gameAreaHTML}
                </div>
            `;
        }

        function renderResults() {
            if(!State.room) return renderLoading();
            const players = Object.values(State.room.players || {}).sort((a,b) => (b.score || 0) - (a.score || 0));
            const winner = players[0];
            const amIWinner = winner?.uid === State.user.uid;

            return `
                <div class="flex-1 flex flex-col p-6 items-center text-center justify-center">
                    <h2 class="text-3xl font-black mb-6 ${amIWinner ? 'text-yellow-400' : 'text-white'}">
                        ${amIWinner ? '🎉 لقد فزت بالمركز الأول! 🎉' : 'انتهت اللعبة!'}
                    </h2>
                    <div class="glass-panel p-6 rounded-2xl w-full mb-6">
                        <h3 class="font-bold mb-4 text-primary">لوحة الشرف</h3>
                        <div class="flex flex-col gap-2">
                            ${players.map((p, idx) => `
                                <div class="flex justify-between items-center bg-black/30 p-3 rounded-xl">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'}</span>
                                        <span>${p.avatar}${p.name}</span>
                                    </div>
                                    <span class="font-bold text-secondary">${p.score} نقطة</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <button data-action="return-lobby" class="btn-primary w-full py-4 rounded-xl font-bold text-lg cursor-pointer">العودة للوبي</button>
                </div>
            `;
        }

        // Sound System
        const AudioSys = {
            ctx: null,
            init() {
                if(!this.ctx) {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if(this.ctx.state === 'suspended') this.ctx.resume();
            },
            playTone(freq, type, dur, vol=0.1) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + dur);
                    osc.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            },
            beep() { this.playTone(600, 'sine', 0.1); },
            click() { this.playTone(800, 'triangle', 0.05, 0.05); },
            success() { this.playTone(800, 'square', 0.1); setTimeout(()=>this.playTone(1200, 'square', 0.2), 100); },
            fail() { this.playTone(300, 'sawtooth', 0.3); }
        };

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Action Handlers & Simulation Router
        function attachEventListeners() {
            document.querySelectorAll('[data-action]').forEach(el => {
                el.onclick = (e) => {
                    AudioSys.click();
                    const action = el.getAttribute('data-action');
                    const val = el.getAttribute('data-val');

                    if (action === 'select-avatar') {
                        document.querySelectorAll('.avatar-btn').forEach(b => {
                            b.classList.remove('border-primary', 'bg-primary/20');
                            b.classList.add('border-transparent', 'bg-white/5');
                        });
                        el.classList.remove('border-transparent', 'bg-white/5');
                        el.classList.add('border-primary', 'bg-primary/25');
                        State.selectedAvatar = val;
                    } else if (action === 'create-profile') {
                        const nameInput = document.getElementById('username-input').value.trim();
                        const name = nameInput || `لاعب ${Math.floor(Math.random()*900+100)}`;
                        const avatar = State.selectedAvatar || '🦊';
                        State.user = { uid: 'user_' + Math.random().toString(36).substring(2, 9), name, avatar, coins: 100, xp: 0, level: 1 };
                        State.view = 'menu';
                        render();
                        showToast(`مرحباً بك يا ${name}!`);
                    } else if (action === 'go-shop') {
                        State.view = 'shop';
                        render();
                    } else if (action === 'go-menu') {
                        State.view = 'menu';
                        render();
                    } else if (action === 'go-ads') {
                        State.view = 'ads';
                        render();
                    } else if (action === 'buy-vip') {
                        showToast('تم تفعيل ميزة إزالة الإعلانات بنجاح! 👑');
                    } else if (action === 'watch-ad') {
                        State.user.coins += 50;
                        showToast('حصلت على 50 عملة بنجاح! 🪙');
                        State.view = 'menu';
                        render();
                    } else if (action === 'buy-avatar') {
                        State.user.avatar = val;
                        showToast('تم تغيير الصورة الرمزية!');
                        render();
                    } else if (action === 'create-room') {
                        const code = Math.random().toString(36).substring(2, 7).toUpperCase();
                        State.roomId = code;
                        State.room = {
                            host: State.user.uid,
                            status: 'lobby',
                            players: {
                                [State.user.uid]: { uid: State.user.uid, name: State.user.name, avatar: State.user.avatar, isReady: true, score: 0, micOn: false }
                            },
                            chat: [{ name: 'النظام', text: `تم إنشاء الغرفة برمز ${code}` }]
                        };
                        State.view = 'lobby';
                        render();
                        showToast('تم إنشاء الغرفة بنجاح!');
                    } else if (action === 'join-room') {
                        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
                        if(!code || code.length < 3) {
                            showToast('الرجاء إدخال رمز غرفة صحيح');
                            return;
                        }
                        State.roomId = code;
                        // Create simulated room with bots for instant play
                        State.room = {
                            host: 'bot_host',
                            status: 'lobby',
                            players: {
                                'bot_host': { uid: 'bot_host', name: 'أحمد 🤖', avatar: '🤖', isReady: true, score: 0, micOn: true },
                                [State.user.uid]: { uid: State.user.uid, name: State.user.name, avatar: State.user.avatar, isReady: false, score: 0, micOn: false }
                            },
                            chat: [{ name: 'النظام', text: `انضممت للغرفة ${code} بنجاح` }]
                        };
                        State.view = 'lobby';
                        render();
                        showToast('تم الانضمام للغرفة بنجاح!');
                    } else if (action === 'leave-room') {
                        State.room = null;
                        State.roomId = null;
                        State.view = 'menu';
                        render();
                        showToast('تمت مغادرة الغرفة');
                    } else if (action === 'toggle-mic') {
                        State.myMicOn = !State.myMicOn;
                        if(State.room?.players?.[State.user.uid]) {
                            State.room.players[State.user.uid].micOn = State.myMicOn;
                        }
                        render();
                        showToast(State.myMicOn ? 'تم فتح الميكروفون 🎤' : 'تم كتم الصوت 🔇');
                    } else if (action === 'toggle-ready') {
                        const p = State.room.players[State.user.uid];
                        p.isReady = !p.isReady;
                        render();
                    } else if (action === 'send-chat') {
                        const input = document.getElementById('chat-input');
                        const text = input.value.trim();
                        if(text) {
                            State.room.chat.push({ name: State.user.name, text });
                            input.value = '';
                            render();
                            const chatContainer = document.getElementById('chat-messages');
                            if(chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    } else if (action === 'start-game') {
                        startMiniGame();
                    } else if (action === 'return-lobby') {
                        State.room.status = 'lobby';
                        Object.values(State.room.players).forEach(p => { p.score = 0; p.isReady = false; });
                        State.view = 'lobby';
                        render();
                    } else if (action === 'tap-target') {
                        AudioSys.success();
                        State.room.players[State.user.uid].score += 10;
                        State.gameLocalState.targetPos = {
                            x: Math.floor(Math.random() * 80 + 10),
                            y: Math.floor(Math.random() * 80 + 10)
                        };
                        render();
                    } else if (action === 'answer-math') {
                        const valNum = parseInt(val);
                        const currentQ = State.room.gameData.questions[State.room.gameData.currentQIndex];
                        if (valNum === currentQ.ans) {
                            AudioSys.success();
                            State.room.players[State.user.uid].score += 25;
                            showToast('إجابة صحيحة! +25');
                        } else {
                            AudioSys.fail();
                            showToast('إجابة خاطئة!');
                        }
                        State.room.gameData.currentQIndex++;
                        if (State.room.gameData.currentQIndex >= State.room.gameData.questions.length) {
                            endGame();
                        } else {
                            render();
                        }
                    } else if (action === 'answer-color') {
                        const currentQ = State.room.gameData.questions[State.room.gameData.currentQIndex];
                        if (val === currentQ.wordColor) {
                            AudioSys.success();
                            State.room.players[State.user.uid].score += 25;
                            showToast('إجابة صحيحة! +25');
                        } else {
                            AudioSys.fail();
                            showToast('إجابة خاطئة!');
                        }
                        State.room.gameData.currentQIndex++;
                        if (State.room.gameData.currentQIndex >= State.room.gameData.questions.length) {
                            endGame();
                        } else {
                            render();
                        }
                    }
                };
            });
        }

        function startMiniGame() {
            const randomGame = MINIGAMES[Math.floor(Math.random() * MINIGAMES.length)];
            
            // Generate questions if math or color
            let questions = [];
            if (randomGame.id === 'quick_math') {
                for(let i=0; i<5; i++) {
                    const a = Math.floor(Math.random() * 20 + 1);
                    const b = Math.floor(Math.random() * 20 + 1);
                    const ans = a + b;
                    let options = [ans, ans + 2, ans - 3, ans + 4].sort(() => Math.random() - 0.5);
                    questions.push({ q: `${a} + ${b}`, ans, options });
                }
            } else if (randomGame.id === 'color_match') {
                const colors = ['red', 'blue', 'green', 'yellow'];
                for(let i=0; i<5; i++) {
                    const wordColor = colors[Math.floor(Math.random() * colors.length)];
                    const visualColor = colors[Math.floor(Math.random() * colors.length)];
                    questions.push({ wordColor, visualColor, options: colors });
                }
            }

            State.room.status = 'countdown';
            State.room.gameData = { type: randomGame.id, questions, currentQIndex: 0 };
            render();

            let count = 3;
            const cdInterval = setInterval(() => {
                count--;
                const numEl = document.getElementById('countdown-num');
                if(numEl) numEl.innerText = count;
                if(count <= 0) {
                    clearInterval(cdInterval);
                    State.room.status = 'playing';
                    State.gameLocalState.timeLeft = 30;
                    render();
                    
                    // Main Timer loop
                    if(State.gameInterval) clearInterval(State.gameInterval);
                    State.gameInterval = setInterval(() => {
                        State.gameLocalState.timeLeft--;
                        const timerEl = document.querySelector('.timer-display');
                        if(timerEl) timerEl.innerText = State.gameLocalState.timeLeft + 's';
                        
                        // Simulate bots scoring
                        if(Math.random() > 0.6) {
                            Object.values(State.room.players).forEach(p => {
                                if(p.uid !== State.user.uid) p.score += Math.floor(Math.random() * 5);
                            });
                        }

                        if(State.gameLocalState.timeLeft <= 0) {
                            clearInterval(State.gameInterval);
                            endGame();
                        }
                    }, 1000);
                }
            }, 1000);
        }

        function endGame() {
            if(State.gameInterval) clearInterval(State.gameInterval);
            State.room.status = 'results';
            State.user.coins += 20;
            State.user.xp += 50;
            if(State.user.xp >= 100) { State.user.level++; State.user.xp = 0; }
            State.view = 'results';
            render();
            AudioSys.success();
        }

        // Initialize App
        window.onload = () => {
            State.view = 'login';
            render();
        };
    </script>
</body>
